name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC / Trusted Publishers
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: ''  # never use caching in release builds

      - run: npm ci

      - name: Start example MCP server
        run: node example/server.js &
        env:
          PORT: 3099

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf -X POST -d '{}' http://localhost:3099 > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Smoke test before publish
        run: node mcp-docs.js http://localhost:3099 -o /tmp/test.html

      - run: npm publish
