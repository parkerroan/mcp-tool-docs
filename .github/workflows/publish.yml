name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Start example MCP server
        run: node example/server.js &
        env:
          PORT: 3099

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf -X POST -d '{}' http://localhost:3099 > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Smoke test before publish
        run: node mcp-docs.js http://localhost:3099 -o /tmp/test.html

      - name: Publish to npm
        run: npm publish --access public --provenance
